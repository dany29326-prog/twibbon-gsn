<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twibbon Maker - HUT RI ke-81</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: Arial, sans-serif; }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .shimmer-hover:hover .shimmer-el {
    animation: shimmer 1.5s infinite;
  }
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 p-4 md:p-8">
<div class="max-w-3xl mx-auto space-y-8">

  <div class="text-center space-y-2 pt-4">
    <h1 class="text-3xl md:text-4xl font-extrabold text-blue-700 tracking-tight">Twibbon Maker</h1>
    <p class="text-slate-500 font-medium">Tasyakuran HUT RI ke-81 &mdash; Garda Satya NKRI</p>
  </div>

  <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200">
    <div class="space-y-2">
      <label class="flex items-center text-sm font-bold text-slate-700">
        <span class="bg-green-100 text-green-700 w-6 h-6 rounded-full flex items-center justify-center mr-2 text-xs">1</span>
        Upload Foto Pribadi
      </label>
      <div class="relative">
        <input type="file" accept="image/*" id="user-upload" class="hidden">
        <label for="user-upload" id="upload-label"
          class="flex items-center justify-center w-full px-4 py-3 border-2 border-dashed rounded-xl cursor-pointer transition-all border-slate-300 hover:bg-slate-50 text-slate-600">
          <svg id="upload-icon" class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span class="font-semibold" id="upload-text">Pilih Foto Anda</span>
        </label>
      </div>
    </div>
  </div>

  <div class="bg-white p-5 md:p-8 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center">
    <h2 class="text-lg font-bold text-slate-700 mb-6 w-full text-center border-b pb-4">
      Pratinjau &amp; Atur Posisi
    </h2>

    <div id="canvas-wrap" class="relative w-full max-w-md bg-slate-100 rounded-lg overflow-hidden border-2 border-slate-200 shadow-inner cursor-move touch-none">
      <div id="move-hint" class="absolute top-3 right-3 bg-black/70 text-white text-xs px-3 py-1.5 rounded-full items-center pointer-events-none opacity-80 shadow-lg backdrop-blur-sm z-10 hidden">
        <svg class="w-3 h-3 mr-1.5 inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
        Geser Foto
      </div>
      <canvas id="canvas" class="w-full h-auto block pointer-events-none"></canvas>
    </div>

    <div class="w-full max-w-md mt-8 space-y-4">
      <div class="flex justify-between items-center text-sm font-semibold text-slate-600">
        <label>Perbesar / Perkecil Foto</label>
        <span class="bg-slate-100 px-2 py-1 rounded-md text-xs" id="zoom-label">100%</span>
      </div>

      <div class="flex items-center space-x-4 bg-slate-50 p-4 rounded-xl border border-slate-100 shadow-sm">
        <svg class="w-6 h-6 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg>
        <input type="range" id="zoom-slider" min="0.2" max="3" step="0.05" value="1" disabled
          class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
        <svg class="w-6 h-6 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg>
      </div>

      <div class="flex items-start bg-blue-50/50 p-3 rounded-lg text-sm text-blue-700 border border-blue-100">
        <svg class="w-5 h-5 mr-2 shrink-0 mt-0.5 opacity-75" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <p>Tips: Anda dapat menyentuh/klik lalu <b>menggeser gambar</b> pada kotak pratinjau di atas untuk menyesuaikan posisinya.</p>
      </div>
    </div>
  </div>

  <div class="pb-8">
    <button id="download-btn" disabled
      class="shimmer-hover group relative w-full flex items-center justify-center py-5 px-6 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-2xl font-bold text-xl hover:from-blue-700 hover:to-indigo-700 focus:ring-4 focus:ring-blue-300 disabled:from-slate-300 disabled:to-slate-400 disabled:text-slate-500 disabled:cursor-not-allowed transition-all shadow-xl hover:shadow-2xl overflow-hidden">
      <div class="shimmer-el absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
      <svg class="w-7 h-7 mr-3 transition-transform group-hover:-translate-y-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      <span>Unduh Twibbon Sekarang</span>
    </button>
  </div>

</div>

let frameImg = null;
let userImg = null;
let scale = 1;
let position = { x: 0, y: 0 };
let isDragging = false;
let dragStart = { x: 0, y: 0 };

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const canvasWrap = document.getElementById('canvas-wrap');
const moveHint = document.getElementById('move-hint');
const zoomSlider = document.getElementById('zoom-slider');
const zoomLabel = document.getElementById('zoom-label');
const downloadBtn = document.getElementById('download-btn');
const userUploadInput = document.getElementById('user-upload');
const uploadIcon = document.getElementById('upload-icon');
const uploadText = document.getElementById('upload-text');
const uploadLabel = document.getElementById('upload-label');

function drawCheckerboard(ctx, width, height) {
  const size = 40;
  for (let i = 0; i < width; i += size) {
    for (let j = 0; j < height; j += size) {
      ctx.fillStyle = (i / size + j / size) % 2 === 0 ? '#e2e8f0' : '#cbd5e1';
      ctx.fillRect(i, j, size, size);
    }
  }
}

function render() {
  const canvasWidth = frameImg ? frameImg.width : 1080;
  const canvasHeight = frameImg ? frameImg.height : 1080;

  if (canvas.width !== canvasWidth) canvas.width = canvasWidth;
  if (canvas.height !== canvasHeight) canvas.height = canvasHeight;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!userImg) {
    // Tampilkan pola kotak-kotak untuk menunjukkan area transparan (belum ada foto)
    drawCheckerboard(ctx, canvas.width, canvas.height);
    if (!frameImg) {
      ctx.fillStyle = '#64748b';
      ctx.font = 'bold 36px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Memuat bingkai...', canvas.width / 2, canvas.height / 2);
    }
  }

  if (userImg) {
    const baseScale = Math.max(canvas.width / userImg.width, canvas.height / userImg.height);
    const finalScale = baseScale * scale;
    const imgW = userImg.width * finalScale;
    const imgH = userImg.height * finalScale;
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    ctx.drawImage(
      userImg,
      centerX - imgW / 2 + position.x,
      centerY - imgH / 2 + position.y,
      imgW,
      imgH
    );
  }

  if (frameImg) {
    ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
  }
}

// Load bingkai master otomatis
const fImg = new Image();
fImg.onload = () => { frameImg = fImg; render(); };
fImg.src = FRAME_SRC;

// Upload foto pribadi
userUploadInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      userImg = img;
      scale = 1;
      position = { x: 0, y: 0 };
      zoomSlider.value = 1;
      zoomSlider.disabled = false;
      zoomLabel.textContent = '100%';
      downloadBtn.disabled = false;
      moveHint.classList.remove('hidden');
      uploadIcon.outerHTML = '<svg id="upload-icon" class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>';
      uploadText.textContent = 'Foto Terpilih (Ganti)';
      uploadLabel.classList.remove('border-slate-300', 'hover:bg-slate-50', 'text-slate-600');
      uploadLabel.classList.add('border-green-500', 'bg-green-50', 'text-green-700');
      render();
    };
    img.src = url;
  }
});

// Zoom slider
zoomSlider.addEventListener('input', (e) => {
  scale = parseFloat(e.target.value);
  zoomLabel.textContent = Math.round(scale * 100) + '%';
  render();
});

// Drag logic (mouse + touch)
function getPointerPos(e) {
  if (e.touches && e.touches.length > 0) {
    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
  return { x: e.clientX, y: e.clientY };
}

function handleStart(e) {
  if (!userImg) return;
  isDragging = true;
  dragStart = getPointerPos(e);
  moveHint.classList.add('hidden');
}

function handleMove(e) {
  if (!isDragging || !userImg) return;
  if (e.cancelable) e.preventDefault();

  const pos = getPointerPos(e);
  const dx = pos.x - dragStart.x;
  const dy = pos.y - dragStart.y;

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  position = {
    x: position.x + dx * scaleX,
    y: position.y + dy * scaleY
  };

  dragStart = pos;
  render();
}

function handleEnd() {
  isDragging = false;
  if (userImg) moveHint.classList.remove('hidden');
}

canvasWrap.addEventListener('mousedown', handleStart);
canvasWrap.addEventListener('mousemove', handleMove);
canvasWrap.addEventListener('mouseup', handleEnd);
canvasWrap.addEventListener('mouseleave', handleEnd);
canvasWrap.addEventListener('touchstart', handleStart, { passive: true });
canvasWrap.addEventListener('touchmove', handleMove, { passive: false });
canvasWrap.addEventListener('touchend', handleEnd);

// Download
downloadBtn.addEventListener('click', () => {
  try {
    const dataUrl = canvas.toDataURL('image/png', 1.0);
    const link = document.createElement('a');
    link.download = `Twibbon-HUT-RI-81-${new Date().getTime()}.png`;
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  } catch (err) {
    alert("Gagal mengunduh gambar. Pastikan file valid.");
  }
});
</script>
